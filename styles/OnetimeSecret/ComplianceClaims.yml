extends: existence
message: "Compliance claim: '%s' is an absolute we can't support. Use the hedged phrasing from /en/security/data-protection."
link: /en/security/data-protection
level: warning
ignorecase: true
# Onetime Secret is "designed to support your compliance efforts"; it does not
# certify anyone. This catches absolute claims that contradict that framing.
#
# Deliberately narrow. A bare "HIPAA-compliant" cannot be flagged, because the
# docs legitimately recommend that readers adopt *other* systems that are — see
# "dedicated HIPAA-compliant secure messaging systems" in
# custom-domains/use-cases.md, and the hedged HIPAA note in
# security/data-protection.md. Go's regexp engine has no lookbehind, so instead
# of excluding those contexts the patterns require the claim to be asserted *of
# us*: a first-person or product subject plus "is/are". Same reason "100% secure"
# is subject-anchored — pricing/index.md correctly says "no method of electronic
# transmission or storage is 100% secure", which must not fire.
#
# The cost of that anchoring is that an unattributed claim ("HIPAA compliant
# secret sharing") slips through. Widen only with a false-positive run against
# security/data-protection.md and custom-domains/use-cases.md; a noisy rule here
# would train writers to ignore it.
#
# "guarantees" is matched only in the inflected form, so the honest disclaimer
# "we cannot guarantee its absolute security" stays clean.
#
# \s+ rather than literal spaces so matches survive hard-wrapped paragraphs.
tokens:
  # Certification asserted of Onetime Secret itself.
  - '(?:Onetime\s+Secret|OTS|we|our\s+(?:service|platform|product|system)|the\s+(?:service|platform)|your\s+(?:secrets?|data))\s+(?:is|are)\s+(?:fully\s+|completely\s+|entirely\s+|100%\s+)?(?:HIPAA|SOC\s?2|PCI(?:[\s-]DSS)?|ISO\s?27001|GDPR|CCPA|FedRAMP)[\s-]*compliant'
  # Intensified certification claims, whoever the subject is.
  - '(?:fully|completely|entirely|100%)\s+(?:HIPAA|SOC\s?2|PCI(?:[\s-]DSS)?|ISO\s?27001|GDPR|CCPA|FedRAMP)[\s-]*compliant'
  - 'fully\s+compliant'
  - 'guarantees\s+(?:compliance|security|privacy)'
  - 'guaranteed\s+(?:compliance|security)'
  # Absolute security asserted of Onetime Secret itself.
  - '(?:Onetime\s+Secret|OTS|we|our\s+(?:service|platform|product|system)|the\s+(?:service|platform)|your\s+(?:secrets?|data))\s+(?:is|are)\s+(?:100%|completely|totally|entirely|absolutely)\s+secure'

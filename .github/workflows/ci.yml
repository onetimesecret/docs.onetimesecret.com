# .github/workflows/ci.yml
#
# Build check for pull requests. Ensures the Astro site compiles before merge.
---
name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "claude/*"
      - "feature/*"
      - "fix/*"
      - "i18n/*"
      - "integrate/*"
      - "integration/*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install

      - name: Check sidebar links
        run: pnpm run check:nav

      - name: Check orphaned pages
        run: pnpm run check:orphans

      - name: Check locale configuration
        run: pnpm run check:locales

      - name: Check colour contrast
        run: pnpm run check:contrast

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

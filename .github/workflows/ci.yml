# .github/workflows/ci.yml
#
# Build check for pull requests. Ensures the Astro site compiles before merge.
---
name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "claude/*"
      - "feature/*"
      - "fix/*"
      - "i18n/*"
      - "integrate/*"
      - "integration/*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check sidebar links
        run: pnpm run check:nav

      - name: Check orphaned pages
        run: pnpm run check:orphans

      - name: Check locale configuration
        run: pnpm run check:locales

      - name: Check colour contrast
        run: pnpm run check:contrast

      - name: Test
        run: pnpm test

      - name: Test provenance authoring
        run: python3 -m unittest discover -s tools/tests

      - name: Preserve recorded provenance
        env:
          PROVENANCE_BASE: ${{ github.event.pull_request.base.sha }}
          PROVENANCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PROVENANCE_MERGE_BASE=$(git merge-base "$PROVENANCE_BASE" "$PROVENANCE_HEAD")
          python3 tools/dogfood.py check --preserve-only --base "$PROVENANCE_MERGE_BASE" --head "$PROVENANCE_HEAD"

      - name: Build
        run: pnpm run build

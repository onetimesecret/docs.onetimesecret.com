# .github/workflows/claude-code-review.yml

name: Claude Code Review

on:
  pull_request:
    branches:
      - main
      - develop
      - "integration/*"
      - "integrate/*"
      - "feature/*"
      - "fix/*"
    types: [opened, synchronize, labeled]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'opened') ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'claude-review'))

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f # beta (v0.0.63)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}"
          fallback_model: "${{ vars.CLAUDE_FALLBACK_MODEL || 'claude-sonnet-5' }}"

          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

          # Reuse the same comment on subsequent pushes
          use_sticky_comment: true

      - name: Remove claude-review label
        # Remove label whether success or failure - prevents getting stuck
        if: always() && github.event.action != 'opened'
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'claude-review'
              });
            } catch (error) {
              console.log('Label not found or already removed');
            }

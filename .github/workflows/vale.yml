# .github/workflows/vale.yml
---
name: Vale Prose Lint

# Enforces brand / product-tier terminology (see styles/OnetimeSecret and
# src/content/docs/en/translations/universal/brand-terms.md).
#
# Report-only for now: fail_on_error is false so it annotates PRs without
# blocking. Flip to true once the existing backlog of warnings is cleared.

on:
  pull_request:
    branches:
      - develop
      - main
      - "claude/*"
      - "i18n/*"
      - "integration/*"
      - "integrate/*"
      - "feature/*"
      - "fix/*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    name: Lint prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.14.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decode recorded AI marks for prose linting
        run: node bin/prepare-vale.mjs

      - name: Run Vale
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        # Report-only (see header): findings must not fail the job, and neither
        # should reviewdog infrastructure errors — on PRs touching >300 files
        # GitHub's diff API refuses to serve the diff and reviewdog exits 1
        # without Vale having found anything. Remove when fail_on_error flips.
        continue-on-error: true
        with:
          # Scope to English source content; translations carry localized prose.
          files: src/content/docs/en
          fail_on_error: false
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

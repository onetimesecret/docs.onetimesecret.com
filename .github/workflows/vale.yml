# .github/workflows/vale.yml
---
name: Vale Prose Lint

# Enforces brand / product-tier terminology (see styles/OnetimeSecret and
# src/content/docs/en/translations/universal/brand-terms.md).
#
# Report-only for now: fail_on_error is false so it annotates PRs without
# blocking. Flip to true once the existing backlog of warnings is cleared.

on:
  pull_request:
    branches:
      - develop
      - main
      - "claude/*"
      - "i18n/*"
      - "integration/*"
      - "integrate/*"
      - "feature/*"
      - "fix/*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    name: Lint prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Vale
        uses: errata-ai/vale-action@v3
        # Report-only (see header): findings must not fail the job, and neither
        # should reviewdog infrastructure errors — on PRs touching >300 files
        # GitHub's diff API refuses to serve the diff and reviewdog exits 1
        # without Vale having found anything. Remove when fail_on_error flips.
        continue-on-error: true
        with:
          # Scope to English source content; translations carry localized prose.
          files: src/content/docs/en
          fail_on_error: false
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
